services:
  web:
    build:
      context: .
      args:
        - VITE_NANIT_ACCOUNTS=${VITE_NANIT_ACCOUNTS}
        - VITE_BABY_ID=${VITE_BABY_ID}
    ports:
      - "80:80"
    environment:
      - VITE_NANIT_ACCOUNTS=${VITE_NANIT_ACCOUNTS}
      - VITE_BABY_ID=${VITE_BABY_ID}
      - API_URL=api
    depends_on:
      - api 
    restart: unless-stopped
  api:
    build:
      context: ./api
      args:
        - NODE_ENV=production
        - PORT=3001
    ports:
      - "3001:3001"
    restart: unless-stopped